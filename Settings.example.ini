# Copy this file to `Settings.ini` and fill in real values.
#
# NOTE: database connection values are also read from environment variables
# (DATABASE_HOST, DATABASE_PORT, DATABASE_NAME, DATABASE_USER, DATABASE_PASSWORD),
# which take precedence over this file. That is how the same code runs both inside
# the Docker network (DATABASE_HOST=gw_db) and from the host (DATABASE_HOST=127.0.0.1,
# DATABASE_PORT=53306) without editing anything here.

[database]
DATABASE_NAME: teglon
DATABASE_USER: teglon
# Matches the `teglon` DB user created by docker/db_init/teglon_users.sql.
# Leave as-is for the bundled Docker database.
DATABASE_PASSWORD: 4tegl0n123!!
DATABASE_HOST: gw_db
DATABASE_PORT: 3306

[treasuremap]
TM_API_TOKEN: <your Treasure Map API token>
TM_ENDPOINT: https://treasuremap.space/api/v1

[gracedb]
API_ENDPOINT: https://gracedb.ligo.org/api/

[cosmology]
H0: 70
OMEGA_M: 0.3
OMEGA_DE: 0.7
